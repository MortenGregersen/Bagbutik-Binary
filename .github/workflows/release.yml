name: Release binary package

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source Bagbutik ref to build
        required: true
        default: main
      release_tag:
        description: Binary release tag
        required: true
        default: 24.0.0
      prerelease:
        description: Whether to create a binary pre release
        required: true
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out binary package
        uses: actions/checkout@v4

      - name: Check out source package
        uses: actions/checkout@v4
        with:
          repository: MortenGregersen/Bagbutik
          ref: ${{ inputs.source_ref }}
          path: source

      - name: Build static XCFrameworks
        working-directory: source
        run: ./scripts/build-xcframework.sh

      - name: Record source revision
        id: source-revision
        run: echo "sha=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Update package checksums
        run: ./scripts/update-package-checksums.sh source/output "${{ inputs.release_tag }}"

      - name: Validate package manifest
        run: swift package dump-package

      - name: Commit generated checksums
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git diff --cached --quiet || git commit -m "Update release checksums"
          git push origin HEAD:main

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          prerelease: ${{ inputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            Source repository: https://github.com/MortenGregersen/Bagbutik
            Source ref: `${{ inputs.source_ref }}`
            Source commit: `${{ steps.source-revision.outputs.sha }}`
            Pre release: ${{ inputs.prerelease }}
          files: source/output/*.xcframework.zip
